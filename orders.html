    <!-- Account Dropdown -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {


                const accountToggle =
                    document.querySelector(
                        ".account-toggle"
                    );


                const accountDropdown =
                    document.querySelector(
                        ".account-dropdown"
                    );


                if (
                    accountToggle &&
                    accountDropdown
                ) {


                    accountToggle.addEventListener(
                        "click",
                        function (event) {

                            event.stopPropagation();


                            accountDropdown.classList.toggle(
                                "active"
                            );


                            const isOpen =
                                accountDropdown.classList.contains(
                                    "active"
                                );


                            accountToggle.setAttribute(
                                "aria-expanded",
                                isOpen
                            );

                        }
                    );



                    // Close dropdown
                    // when clicking outside

                    document.addEventListener(
                        "click",
                        function (event) {


                            if (
                                !accountDropdown.contains(
                                    event.target
                                )
                            ) {

                                accountDropdown.classList.remove(
                                    "active"
                                );


                                accountToggle.setAttribute(
                                    "aria-expanded",
                                    "false"
                                );

                            }

                        }
                    );

                }

            }
        );

    </script>
